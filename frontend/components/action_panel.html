cat > frontend/components/action_panel.html << 'EOF'
<div class="action-panel">
    <h3>🎯 Action Controls</h3>
    
    <div class="form-group">
        <label for="actionType">Action Type</label>
        <select id="actionType" class="form-control">
            <optgroup label="🔍 Diagnostic Actions">
                <option value="inspect_logs">📋 Inspect Logs</option>
                <option value="inspect_metrics">📊 Inspect Metrics</option>
                <option value="inspect_traces">🔗 Inspect Traces</option>
            </optgroup>
            <optgroup label="🔧 Remediation Actions">
                <option value="restart_service">🔄 Restart Service</option>
                <option value="rollback_deployment">⏪ Rollback Deployment</option>
                <option value="scale_service">📈 Scale Service</option>
                <option value="isolate_service">🔒 Isolate Service</option>
            </optgroup>
            <optgroup label="✅ Resolution Actions">
                <option value="mark_resolved">✓ Mark Resolved</option>
                <option value="escalate_incident">📞 Escalate Incident</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="targetService">Target Service</label>
        <select id="targetService" class="form-control">
            <option value="api_gateway">API Gateway</option>
            <option value="auth_service">Auth Service</option>
            <option value="user_service">User Service</option>
            <option value="payment_service">Payment Service</option>
            <option value="database">Database</option>
            <option value="cache">Cache Layer</option>
            <option value="notification_service">Notification Service</option>
        </select>
    </div>

    <div class="form-group" id="scaleParams" style="display: none;">
        <label for="scaleFactor">Scale Factor</label>
        <input type="number" id="scaleFactor" class="form-control" value="1.5" step="0.1" min="0.5" max="3.0">
    </div>

    <div class="form-group" id="logCountParams" style="display: none;">
        <label for="logCount">Number of Logs</label>
        <input type="number" id="logCount" class="form-control" value="10" min="1" max="50">
    </div>

    <button id="actionBtn" class="btn btn-action">
        ⚡ Execute Action
    </button>
</div>
EOF
